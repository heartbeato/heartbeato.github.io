<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Веб-дизайн — Гутюм Анастасия</title>
    <link rel="preload" href="fonts/GoshaSans-Light.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/kursor"></script>

        new kursor({

    <header class="header">

    <main class="page">

        <h1 class="page__title">Веб-дизайн</h1>

        <div class="projects">

            <a href="#" class="project">
                <img class="project__image" src="https://placehold.co/2000x2000" alt="">

                    <p class="project__name">«Аданат»</p>
                    <span class="project__button">Смотреть в Figma</span>
                </div>
            </a>

            <a href="#" class="project">

            <a href="#" class="project">

                    <span class="project__button">Смотреть в Figma</span>

    <div class="footer">
        <div class="footer__text">Cайт находится в разработке! Его наполнение будет меняться.</div>
    </div>

</body>
</html>
